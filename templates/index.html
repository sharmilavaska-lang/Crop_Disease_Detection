    /* =========================

    ========================== */ 
 
    function previewImage(event) { 
        const file = event.target.files[0]; 
 
        if (file) { 
            const reader = new FileReader(); 
 
            reader.onload = function(e) { 
                const preview = document.getElementById("imagePreview"); 
                const previewContainer = document.getElementById("previewContainer"); 
 
                if (preview) { 
                    preview.src = e.target.result; 
                } 
 
                if (previewContainer) { 
                    previewContainer.style.display = "block"; 
                } 
            }; 
 
            reader.readAsDataURL(file); 
        } 
    }

    /* ========================= 
       TOGGLE LANGUAGE 
    ========================== */ 
 
    function toggleLanguage() { 
 
        teluguMode = !teluguMode; 
 
        /* Save language */ 
        localStorage.setItem( 
            "cropLanguage", 
            teluguMode ? "telugu" : "english" 
        ); 
 
        /* Button */ 
        const languageButton = 
            document.getElementById("languageButton"); 
 
        if (languageButton) { 
            languageButton.innerText = 
                teluguMode ? "🌐 English" : "🌐 తెలుగు"; 
        } 
 
        /* Apply translations */ 
        applyLanguage(); 
    } 
 
 
    /* ========================= 
       LOAD SAVED LANGUAGE 
    ========================== */ 
 
    window.addEventListener("DOMContentLoaded", function () { 
 
        const savedLanguage = 
            localStorage.getItem("cropLanguage"); 
 
        if (savedLanguage === "telugu") { 
 
            teluguMode = true; 
 
            const languageButton = 
                document.getElementById("languageButton"); 
 
            if (languageButton) { 
                languageButton.innerText = "🌐 English"; 
            } 
 
            applyLanguage(); 
 
        } else { 
 
            teluguMode = false; 
 
            const languageButton = 
                document.getElementById("languageButton"); 
 
            if (languageButton) { 
                languageButton.innerText = "🌐 తెలుగు"; 
            } 
 
            applyLanguage(); 
        } 
 
    });
